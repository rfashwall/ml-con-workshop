name: MLOps Simple CI/CD

# Module 7: simple CI pipeline that builds both workshop images and pushes
# them to GitHub Container Registry. Deployment to the local kind cluster is
# manual (runners can't reach your laptop) — see the deploy job's summary.

on:
  push:
    branches: [main]
    paths:
      - "modules/module-2/**"
      - "modules/module-4/**"
      - "modules/module-7/**"
      - ".github/workflows/mlops-simple.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ML_IMAGE: ${{ github.repository }}/sentiment-api
  GW_IMAGE: ${{ github.repository }}/api-gateway

jobs:
  build-ml-service:
    name: Build ML service (BentoML)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install BentoML
        run: |
          python -m pip install --upgrade pip
          pip install -r modules/module-2/solution/requirements.txt

      - name: Build Bento
        working-directory: modules/module-2/solution
        run: bentoml build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Containerize and push
        working-directory: modules/module-2/solution
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.ML_IMAGE }}:${{ steps.meta.outputs.tag }}"
          bentoml containerize SentimentService:latest \
            --image-tag "$TAG" \
            --platform linux/amd64
          docker push "$TAG"

  build-api-gateway:
    name: Build API gateway (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: modules/module-4
          file: modules/module-4/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.GW_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-instructions:
    name: Print manual deploy commands
    needs: [build-ml-service, build-api-gateway]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          ML_TAG="${{ env.REGISTRY }}/${{ env.ML_IMAGE }}:${{ needs.build-ml-service.outputs.image_tag }}"
          GW_TAG="${{ env.REGISTRY }}/${{ env.GW_IMAGE }}:${{ needs.build-api-gateway.outputs.image_tag }}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Manual deployment to your kind cluster

          GitHub-hosted runners can't reach your local kind cluster. Run these
          commands on your machine to deploy the just-built images:

          \`\`\`bash
          docker pull $ML_TAG
          docker pull $GW_TAG

          kind load docker-image $ML_TAG --name mlops-workshop
          kind load docker-image $GW_TAG --name mlops-workshop

          cd modules/module-7/k8s
          sed -i.bak "s|image:.*sentiment-api.*|image: $ML_TAG|" ml-service.yaml
          sed -i.bak "s|image:.*api-gateway.*|image: $GW_TAG|"   api-gateway.yaml

          kubectl apply -f .
          kubectl rollout status deployment/sentiment-api --timeout=5m
          kubectl rollout status deployment/api-gateway  --timeout=5m
          \`\`\`

          See **[Module 7 wiki](../../wiki/Module-7)** for the full walkthrough.
          EOF
